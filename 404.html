            if (isNaN(count) || count < 1) {
                outputDiv.textContent = 'Value must be >= 1';

            }
            if (count > roster.length) {
                outputDiv.textContent = `Only ${roster.length} Pokémon available.`;

            }

            const picked = shuffled.slice(0, count);
            outputDiv.textContent = picked.join(' | ');
